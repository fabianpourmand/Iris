<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IRIS Category Deck Mockup</title>
    <style>
      :root {
        --bg: #050705;
        --panel: rgba(18, 22, 18, 0.78);
        --panel-2: rgba(24, 28, 24, 0.65);
        --border: rgba(255, 255, 255, 0.09);
        --muted: rgba(255, 255, 255, 0.62);
        --ink: rgba(255, 255, 255, 0.92);
        --accent: #1f6d5a;
        --accent-2: #8bffde;
        --card: rgba(255, 255, 255, 0.045);
        --card-hover: rgba(255, 255, 255, 0.07);
        --active: #0f3f2c;
        --tooltip: #04180f;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      }

      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
        background: radial-gradient(900px 480px at 55% 15%, rgba(31, 109, 90, 0.22), transparent 60%),
          radial-gradient(900px 520px at 20% 60%, rgba(139, 255, 222, 0.08), transparent 55%),
          linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0.9)),
          var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .shell {
        width: min(1080px, 100%);
        border-radius: 30px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border: 1px solid rgba(31, 109, 90, 0.25);
        background: rgba(31, 109, 90, 0.09);
        border-radius: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent-2);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(31, 109, 90, 0.18);
      }

      .deck {
        padding: 14px 18px 18px;
        background: var(--panel-2);
      }

      .deck-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.10);
        margin-top: 14px;
      }

      .card {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 16px;
        padding: 12px 10px;
        min-height: 86px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--ink);
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
        position: relative;
        user-select: none;
      }

      .card:hover {
        transform: translateY(-2px);
        background: var(--card-hover);
        border-color: rgba(31, 109, 90, 0.65);
      }

      .card.active {
        background: linear-gradient(180deg, rgba(15, 63, 44, 0.95), rgba(15, 63, 44, 0.78));
        border-color: transparent;
        box-shadow: 0 14px 35px rgba(15, 63, 44, 0.55);
      }

      .indicator {
        position: absolute;
        left: 6px;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 44px;
        border-radius: 999px;
        background: radial-gradient(circle at 50% 20%, var(--accent-2), var(--accent));
        opacity: 0;
        transition: opacity 120ms ease;
      }

      .card.active .indicator {
        opacity: 1;
      }

      .icon {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }

      .card.active .icon {
        color: rgba(255, 255, 255, 0.92);
      }

      .label {
        font-weight: 750;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.88);
      }

      .card:not(.active) .label {
        color: rgba(255, 255, 255, 0.78);
      }

      .tooltip {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 10px);
        transform: translateX(-50%);
        width: 260px;
        border-radius: 14px;
        border: 1px solid rgba(31, 109, 90, 0.95);
        background: linear-gradient(180deg, rgba(4, 24, 15, 0.98), rgba(4, 24, 15, 0.86));
        padding: 10px 12px;
        box-shadow: 0 16px 45px rgba(0,0,0,0.55);
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .tooltip .kicker {
        font-size: 10px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(139, 255, 222, 0.92);
        margin-bottom: 6px;
      }

      .tooltip .body {
        font-size: 13px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.80);
      }

      .tooltip::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 100%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 10px solid rgba(4, 24, 15, 0.98);
        filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
      }

      .card.active:hover .tooltip {
        opacity: 1;
        transform: translateX(-50%) translateY(-2px);
      }

      .content {
        padding: 22px 20px 26px;
        background: rgba(255, 255, 255, 0.02);
      }

      .content h2 {
        margin: 0 0 10px;
        font-size: 14px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.66);
      }

      .content .ghost {
        height: 220px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      }

      @media (max-width: 980px) {
        .deck-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 640px) {
        .deck-grid {
          display: flex;
          gap: 12px;
          overflow-x: auto;
          padding-bottom: 6px;
          scroll-snap-type: x mandatory;
        }
        .card {
          flex: 0 0 140px;
          min-height: 78px;
          scroll-snap-align: start;
        }
        .tooltip { width: 220px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="shell">
        <div class="topbar">
          <div class="badge"><span class="dot"></span>Auto</div>
          <div style="flex: 1"></div>
          <div style="display:flex; gap:10px; align-items:center; opacity:0.9;">
            <span class="dot" style="width:7px;height:7px;box-shadow:none;background:rgba(139,255,222,0.9)"></span>
            <span style="font-weight:800; letter-spacing:0.22em; text-transform:uppercase; font-size:12px;">Ready</span>
          </div>
        </div>

        <div class="deck">
          <div class="deck-grid" id="deck"></div>
          <div class="divider"></div>
        </div>

        <div class="content">
          <h2>Conversation (Placeholder)</h2>
          <div class="ghost"></div>
        </div>
      </div>
    </div>

    <script>
      const cards = [
        {
          id: 'auto',
          label: 'Auto',
          description: 'IRIS chooses the clearest path for you.',
          icon: '<path d="M12 2c0 0 1.2 4.6 3.9 7.6S22 12 22 12c-2 2-2 5-2 5-.8-1.4-3.8-3-6.4-1.8S7.5 21 7.5 21C5 17 4.1 13 4.1 13 7.5 11 10.9 8 12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
        },
        {
          id: 'general',
          label: 'General',
          description: 'Everyday questions, brainstorming, and planning.',
          icon: '<path d="M4 5h16M4 12h10M4 19h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
        },
        {
          id: 'code',
          label: 'Code',
          description: 'Software insight, debugging, and architecture.',
          icon: '<path d="M9 18 3 12l6-6M15 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
        },
        {
          id: 'medical',
          label: 'Medical',
          description: 'First-aid, symptoms, and care guidance.',
          icon: '<path d="M12 2c1.7 0 3 1.3 3 3v4H9V5c0-1.7 1.3-3 3-3Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11h14c.6 0 1 .4 1 1v5c0 2.2-1.8 4-4 4H8c-2.2 0-4-1.8-4-4v-5c0-.6.4-1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
        },
        {
          id: 'math',
          label: 'Math',
          description: 'Equations, analysis, and quantitative help.',
          icon: '<path d="M7 7h10M7 12h10M7 17h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
        },
        {
          id: 'chemistry',
          label: 'Chemistry',
          description: 'Formulas, lab sense, and reactions.',
          icon: '<path d="M10 2v6L5 19a2 2 0 0 0 1.7 3h10.6A2 2 0 0 0 19 19L14 8V2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 14h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
        },
        {
          id: 'survival',
          label: 'Survival',
          description: 'Wilderness skills, shelter, and rescue tips.',
          icon: '<path d="M4 20 12 4l8 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 20l4-6 4 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
        },
        {
          id: 'planting',
          label: 'Planting',
          description: 'Gardening, crops, and food-production ideas.',
          icon: '<path d="M12 20V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 9c-4 0-7-2-8-6 4-1 8 1 8 6Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9c4 0 7-2 8-6-4-1-8 1-8 6Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
        },
        {
          id: 'building',
          label: 'Building',
          description: 'Construction, repairs, and DIY know-how.',
          icon: '<path d="M3 21h6l12-12-6-6L3 15v6Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 4l6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
        },
        {
          id: 'uncensored',
          label: 'Uncensored',
          description: 'Open, unfiltered exploration when needed.',
          icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
        }
      ];

      let active = 'auto';
      const deck = document.getElementById('deck');
      const badge = document.querySelector('.badge');
      const badgeText = badge.childNodes[1];

      function render() {
        deck.innerHTML = '';
        for (const c of cards) {
          const el = document.createElement('button');
          el.className = 'card' + (c.id === active ? ' active' : '');
          el.type = 'button';
          el.innerHTML =
            '<span class="indicator"></span>' +
            '<svg class="icon" viewBox="0 0 24 24" fill="none">' + c.icon + '</svg>' +
            '<span class="label">' + c.label + '</span>' +
            '<div class="tooltip"><div class="kicker">Category Info</div><div class="body">' + c.description + '</div></div>';

          el.addEventListener('click', () => {
            active = c.id;
            badgeText.nodeValue = c.label;
            render();
          });

          deck.appendChild(el);
        }
      }

      render();
    </script>
  </body>
</html>
