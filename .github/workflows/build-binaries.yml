name: Build IRIS Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: USB_ASSISTANT/server
        run: cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: usb-assistant-server-linux-x64
          path: USB_ASSISTANT/server/target/release/usb-assistant-server

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        working-directory: USB_ASSISTANT/server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: usb-assistant-server-linux-arm64
          path: USB_ASSISTANT/server/target/aarch64-unknown-linux-gnu/release/usb-assistant-server

  mac-x64:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build
        working-directory: USB_ASSISTANT/server
        run: cargo build --release --target x86_64-apple-darwin
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: usb-assistant-server-mac-x64
          path: USB_ASSISTANT/server/target/x86_64-apple-darwin/release/usb-assistant-server

  mac-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build
        working-directory: USB_ASSISTANT/server
        run: cargo build --release --target aarch64-apple-darwin
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: usb-assistant-server-mac-arm64
          path: USB_ASSISTANT/server/target/aarch64-apple-darwin/release/usb-assistant-server

  win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        working-directory: USB_ASSISTANT/server
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: usb-assistant-server-win-x64
          path: USB_ASSISTANT/server/target/x86_64-pc-windows-msvc/release/usb-assistant-server.exe
